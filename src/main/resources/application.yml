spring:
  datasource:
    url: jdbc:sqlite:assets-board.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.community.dialect.SQLiteDialect
  properties:
    hibernate:
      format_sql: true
#Financial websocket
financial:
  twelve:
    api:
      token: ${TWELVE_API_KEY:twelve}
  websocket:
    url: wss://ws.finnhub.io  # Replace with actual WebSocket URL
  api:
    token: ${FINANCIAL_API_TOKEN:test}

# Strategy config
strategy:
  risk: 1
  reward:
  stop-loss-range:
  take-profit-range:


server:
  port: 8081

redis:
  default-retention: 3600000

taxpayer:
  tin: ${TAXPAYER_TIN:}
  name: ${TAXPAYER_NAME:}
  city: ${TAXPAYER_CITY:}
  street: ${TAXPAYER_STREET:}
  building: ${TAXPAYER_BUILDING:1}
  c-reg: ${TAXPAYER_C_REG:0}
  c-raj: ${TAXPAYER_C_RAJ:0}
  c-sti-orig: ${TAXPAYER_C_STI_ORIG:0}
  tax-office: ${TAXPAYER_TAX_OFFICE:ДПС}

